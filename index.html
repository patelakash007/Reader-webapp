<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reader Webapp - Minimal Text &amp; Markdown Reader</title>
<meta name="description" content="A minimal personal reader for copied text and Markdown with visual presets, swipe gestures, and TTS speech synthesis.">
<meta name="theme-color" content="#faf8f5">
<meta name="application-name" content="Reader Webapp">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="progressBar"></div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <button class="mobile-fab" id="mobileFab" type="button" aria-label="Open Reading Settings" aria-controls="toolbar" aria-expanded="false">
    <span class="mobile-fab-icon" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="11" cy="18" r="2" fill="currentColor"/></svg>
    </span>
  </button>

  <main>
  <section id="inputView" aria-label="Text input">
    <h1 class="brand">Reader</h1>
    <div class="subtitle">Paste copied text or Markdown to start reading</div>
    <textarea class="paste-area" id="pasteArea" aria-label="Text to read" placeholder="Paste text here..." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="controls-row">
      <button class="btn btn-primary" id="readBtn" type="button">Read Text</button>
      <button class="btn btn-secondary" id="clearBtn" type="button">Clear</button>
    </div>
    <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
  </section>

  <section id="readerView" aria-label="Reader view">
    <button class="back-btn" id="backBtn" type="button" aria-label="Go Back">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>

    <div id="toolbar">
      <button class="bottom-sheet-handle" id="bottomSheetHandle" type="button" aria-label="Collapse Reading Settings"></button>

      <div class="settings-drawer active" id="settingsDrawer" aria-label="Reading settings">
        <section class="settings-section is-open" data-settings-section="theme">
          <button class="settings-section-toggle" type="button" aria-expanded="true" aria-controls="themeSettingsPanel">
            <span>
              <span class="settings-section-title">Theme &amp; Presets</span>
              <span class="settings-section-summary" id="themeSettingsSummary">Claude, Light</span>
            </span>
            <span class="settings-section-chevron" aria-hidden="true"></span>
          </button>
          <div class="settings-section-panel" id="themeSettingsPanel">
            <div class="settings-panel-inner">
              <div class="preset-carousel" id="presetCarousel">
                <button class="preset-arrow" id="arrowLeft" type="button" aria-label="Previous Preset">
                  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="preset-window" id="presetWindow" tabindex="0" role="region" aria-label="Reading preset carousel">
                  <div class="preset-track snapping" id="presetTrack"></div>
                </div>
                <button class="preset-arrow" id="arrowRight" type="button" aria-label="Next Preset">
                  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
              <div class="preset-dots" id="presetDots" aria-hidden="true"></div>
              <div class="mode-toggle-row">
                <button class="mode-btn active" id="modeLight" type="button" aria-pressed="true">
                  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                  Light
                </button>
                <button class="mode-btn" id="modeDark" type="button" aria-pressed="false">
                  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                  Dark
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="settings-section" data-settings-section="text">
          <button class="settings-section-toggle" type="button" aria-expanded="false" aria-controls="textSettingsPanel">
            <span>
              <span class="settings-section-title">Text</span>
              <span class="settings-section-summary">Size, spacing, margins</span>
            </span>
            <span class="settings-section-chevron" aria-hidden="true"></span>
          </button>
          <div class="settings-section-panel" id="textSettingsPanel" hidden>
            <div class="settings-panel-inner">
              <div class="size-choice-row" role="group" aria-label="Text size">
                <button class="tb-btn" data-size="small" type="button" aria-label="Small text size" aria-pressed="false">S</button>
                <button class="tb-btn active" data-size="medium" type="button" aria-label="Medium text size" aria-pressed="true">M</button>
                <button class="tb-btn" data-size="large" type="button" aria-label="Large text size" aria-pressed="false">L</button>
                <button class="tb-btn" data-size="xl" type="button" aria-label="Extra large text size" aria-pressed="false">XL</button>
              </div>
              <div class="settings-row">
                <div class="control-item">
                  <div class="control-label-row">
                    <label for="lineHeightInput">Line Height</label>
                    <span class="value-display" id="lineHeightVal">1.85</span>
                  </div>
                  <input type="range" id="lineHeightInput" min="1.4" max="2.6" step="0.05" value="1.85">
                </div>
                <div class="control-item">
                  <div class="control-label-row">
                    <label for="letterSpacingInput">Letter Spacing</label>
                    <span class="value-display" id="letterSpacingVal">-0.015em</span>
                  </div>
                  <input type="range" id="letterSpacingInput" min="-0.03" max="0.15" step="0.005" value="-0.015">
                </div>
                <div class="control-item">
                  <div class="control-label-row">
                    <label for="marginInput">Margins</label>
                    <span class="value-display" id="marginVal">24px</span>
                  </div>
                  <input type="range" id="marginInput" min="12" max="80" step="4" value="24">
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="settings-section" data-settings-section="listen">
          <button class="settings-section-toggle" type="button" aria-expanded="false" aria-controls="listenSettingsPanel">
            <span>
              <span class="settings-section-title">Speech (TTS)</span>
              <span class="settings-section-summary">Voice and speed</span>
            </span>
            <span class="settings-section-chevron" aria-hidden="true"></span>
          </button>
          <div class="settings-section-panel" id="listenSettingsPanel" hidden>
            <div class="settings-panel-inner">
              <div class="tool-grid">
                <button class="tb-btn" id="ttsBtn" type="button" title="Start Read Aloud" aria-label="Start Read Aloud" aria-pressed="false">
                  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
                  Read Aloud
                </button>
                <button class="tb-btn" id="ttsStopBtn" type="button" title="Stop Read Aloud" aria-label="Stop Read Aloud" disabled>
                  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
                  Stop
                </button>
              </div>
              <div class="settings-row">
                <div class="control-item voice-control">
                  <label for="voiceSelect">Voice</label>
                  <select id="voiceSelect"><option value="">System default voice</option></select>
                </div>
                <div class="control-item">
                  <div class="control-label-row">
                    <label for="voiceRateInput">Voice Speed</label>
                    <span class="value-display" id="voiceRateVal">1.0x</span>
                  </div>
                  <input type="range" id="voiceRateInput" min="0.5" max="2.5" step="0.1" value="1.0">
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Semantic article element for reader content -->
    <article class="reader-content fs-medium" id="readerContent"></article>
    <div class="status-message reader-status-message" id="readerStatusMessage" role="status" aria-live="polite"></div>

    <!-- Floating Audio Player Bar -->
    <div class="audio-player-bar" id="audioPlayerBar" role="region" aria-label="Audio player controls" aria-hidden="true">
      <button class="audio-bar-btn" id="audioPlayPauseBtn" type="button" title="Play or Pause narration" aria-label="Play or Pause narration">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      </button>
      <button class="audio-bar-btn" id="audioStopBtn" type="button" title="Stop narration" aria-label="Stop narration" disabled>
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
      <div class="audio-bar-info">
        <span class="audio-bar-title" id="audioStatusText">Speech Ready</span>
        <span class="audio-bar-hint">Click word to speak</span>
      </div>
      <div class="audio-bar-actions">
        <button class="audio-bar-chip" id="audioSpeedBtn" type="button" title="Narration speed" aria-label="Narration speed: 1.0x">1.0x</button>
      </div>
    </div>
  </section>
  </main>

  <div id="gestureHint" aria-hidden="true">
    <div class="gesture-hint-text" id="gestureHintText"></div>
    <div class="gesture-hint-sub" id="gestureHintSub"></div>
  </div>

  <div id="loader" role="status" aria-live="assertive" aria-atomic="true">
    <div class="spinner"></div>
    <div class="loader-text">Loading text&#8230;</div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
