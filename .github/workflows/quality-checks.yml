name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium for smoke tests
        run: npx playwright-core install --with-deps chromium

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "style.css"
            "script.js"
            "src/app.mjs"
            "manifest.webmanifest"
            "sw.js"
            "README.md"
            "LICENSE"
            "vendor/marked.esm.mjs"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file" >&2
              exit 1
            fi
          done

      - name: Check CSP meta tag
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'Content-Security-Policy' index.html

      - name: Check for CDN URLs
        shell: bash
        run: |
          set -euo pipefail

          if grep -REin '(cdn(js)?|unpkg|jsdelivr)' index.html style.css script.js src; then
            echo "CDN reference found in app source files." >&2
            exit 1
          fi

      - name: Check JavaScript syntax
        run: npm run test:syntax

      - name: Lint JavaScript with pinned ESLint
        run: npm run lint

      - name: Validate PWA app shell
        run: npm run test:pwa

      - name: Run unit & regression tests
        run: npm run test:unit

      - name: Run empirical stress tests
        run: npm run test:empirical

      - name: Run browser smoke checks
        run: npm run test:smoke

      - name: Run deep browser regression
        run: npm run test:deep

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-output
          path: output/browser-smoke/
          if-no-files-found: ignore
